# Never fetch these at all (login walls, trackers, app stores, file hosts)
deny_fetch:
  - play.google.com
  - apps.apple.com
  - google.com
  - goo.gl
  - bit.ly
  - docs.google.com
  - forms.gle
  - drive.google.com

# Words that suggest an organisation type when classifying heuristically
name_hints:
  NGO_TRUST: ["foundation", "trust", "society", "charitable", "endowment", "ngo", "samiti", "sansthan"]
  CORPORATE_CSR: ["bank", "limited", "ltd", "industries", "corporation", "corp", "capital", "finance", "csr", "group", "motors", "steel", "power", "oil", "insurance", "technologies", "infosys", "wipro", "tata", "birla", "mahindra", "bajaj", "reliance"]
  UNIVERSITY: ["university", "institute of technology", "iit", "iim", "nit", "iiser", "college"]
  GOVERNMENT: ["ministry", "department", "commission", "government", "council", "board", "directorate"]
